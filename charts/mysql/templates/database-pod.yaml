{{- range $index, $service := .Values.services }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-{{ $.Release.Name }}-{{ $service.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  # helm --wait (which the ZopDay installer always passes) requires every Pod it
  # owns to reach Ready=True. A bare Pod that finishes its work reports
  # Succeeded / Ready=False / PodCompleted and NEVER goes Ready, so --wait sat
  # for its full timeout and --atomic then rolled back a release that had in
  # fact installed correctly. A Job is the right kind for run-once work: helm
  # tracks the Job's completion instead of pod readiness.
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: mysql-init-{{ $.Release.Name }}-{{ $service.name }}
    spec:
      containers:
        - name: mysql-init-role
          image: imega/mysql-client
          command: ["mysql"]
          args:
            ["-h", "{{ $.Release.Name }}-mysql", "-u", "root", "-p$(ROOTPASSWORD)", "-e", "source /etc/config/db-init.sql"]
          env:
            - name: ROOTPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{$.Release.Name}}-mysql-root-secret
                  key: root-password
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/config
      volumes:
        - name: secret-volume
          configMap:
            name: {{$.Release.Name}}-{{ .name }}-init-script
      restartPolicy: OnFailure
---
{{- end }}