# Size of the persistent volume claim (PVC) backing /var/lib/clickhouse.
diskSize: "10Gi"

# Resource configuration
resources:
  requests:
    cpu: "500m"
    memory: "512M"
  limits:
    cpu: "2000m"
    memory: "2048M"

# ClickHouse server image tag (clickhouse/clickhouse-server:<version>).
version: "25.3"

# Extra ClickHouse configuration. Provided as a full XML document and mounted
# into both config tree directories, layered on top of the defaults:
#   - /etc/clickhouse-server/config.d/custom.xml  (server-level settings)
#   - /etc/clickhouse-server/users.d/custom.xml   (profile/user settings)
# ClickHouse reads the relevant sections from each tree and ignores the rest,
# so server settings and a <profiles> block can live in one document.
customConfig: ""

# Databases and users to provision on startup. Each entry creates a database,
# a user with read/write access to it, and a connection ConfigMap + Secret the
# application can mount. Leave empty to deploy ClickHouse without app databases.
services: []
#  - name: orders
#    database: analytics
