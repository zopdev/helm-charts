disk_size: "10Gi" 

version: "2.0.18"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

auth:
  enabled: true
  users:         
    - username: "admin"

tls:
  enabled: false
  cert_secret: "mosquitto-tls-secret" 

service:           
  type: ClusterIP

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
