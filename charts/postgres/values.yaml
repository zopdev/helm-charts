# Name of the service this datastore belongs to. Used as the
# `service` label on the alerts, so they can be attributed to an
# owner. Defaults to the release name when unset.
name: ""

version: "17.4.0"

replication:
  enabled: false
  count: 1

diskSize : "10Gi"

resources:
  requests:
    cpu: "250m"
    memory: "500Mi"
  limits:
    cpu: "500m"
    memory: "1000Mi"

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
