{{- if not .Values.encryptionKey.existingSecret }}
{{/*
n8n encrypts stored credentials with this key. If it changes, every credential
already in the database becomes undecryptable - the workflows survive, but each
credential has to be entered again. So it is generated once on install and read
back from the live Secret on every upgrade, never regenerated.

`lookup` returns nothing during `helm template` and `--dry-run`, so a rendered
manifest always shows a fresh key. That is an artefact of rendering without a
cluster, not what an upgrade does to a real release.
*/}}
{{- $secretName := printf "%s-encryption" (include "n8n.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := randAlphaNum 32 }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.encryptionKey.secretKey) }}
{{- $key = index $existing.data .Values.encryptionKey.secretKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Kept for the same reason the data volume is kept. The n8n PVC carries
    # resource-policy: keep and the postgres subchart uses volumeClaimTemplates,
    # which Kubernetes never deletes - so an uninstall leaves the database intact
    # while, without this, deleting the only key that can decrypt the credentials
    # inside it. Reinstalling the same release re-adopts this secret and the
    # stored credentials keep working.
    helm.sh/resource-policy: keep
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.encryptionKey.secretKey }}: {{ $key | b64enc }}
{{- end }}
