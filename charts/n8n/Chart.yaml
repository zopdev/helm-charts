apiVersion: v2
# Pinned to the semver tag that `stable` and `latest` currently resolve to.
# Both of those are moving tags, so naming one of them here would make two
# installs of the same chart version run different code.
appVersion: "2.34.5"
description: Helm chart for deploying n8n, a workflow automation platform
name: n8n
version: 0.0.1
type: application
maintainers:
  - name: ZopDev
    url: zop.dev
# PostgreSQL holds workflows, credentials and execution history. It is the
# default and only supported datastore for this chart; point the release at an
# existing server with externalDatabase instead of turning this off.
dependencies:
  - name: postgres
    # 0.0.13, not the 0.0.12 the older charts use: from 0.0.13 the alerts
    # template defaults its `service` label instead of rendering it null, which
    # the PrometheusRule CRD rejects and which fails the whole release.
    version: 0.0.13
    repository: https://helm.zop.dev
    condition: postgres.enabled
annotations:
  type: application
