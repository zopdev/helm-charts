version: "7.8.0"

zookeeper:
  enabled: true
  url: "" ## If not enabled provide the zookeeper url

resources:
  requests:
    cpu: "500m"
    memory: "500Mi"
  limits:
    cpu: "1000m"
    memory: "1500Mi"

diskSize : 10Gi

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
