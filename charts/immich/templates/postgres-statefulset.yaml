{{/*
Immich's own postgres image, not the zopdev postgres chart -- it bundles
the vectorchord extension the server's search features require, which
the shared bitnami-based chart does not have.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "immich.postgresFullname" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "immich.postgresFullname" . }}-headless
  selector:
    matchLabels:
      {{- include "immich.selectorLabels" (dict "context" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "immich.selectorLabels" (dict "context" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "immich.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Matches the reference docker-compose's `shm_size: 128mb` --
            # Postgres uses shared memory for parallel query workers, and
            # the container runtime default (64Mi) is too small for it.
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username | quote }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgres.username | quote }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.diskSize }}
