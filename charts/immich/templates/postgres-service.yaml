apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.postgresFullname" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "immich.selectorLabels" (dict "context" $ "component" "postgres") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.postgresFullname" . }}-headless
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "immich.selectorLabels" (dict "context" $ "component" "postgres") | nindent 4 }}
