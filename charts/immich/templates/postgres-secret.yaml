{{- $secretName := include "immich.postgresSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := printf "%s%s%s" (randAlpha 4) (randNumeric 4) (randAlpha 4 | upper) }}
{{- if and $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc }}
