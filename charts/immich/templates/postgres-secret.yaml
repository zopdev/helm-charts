{{/*
Not rendered when postgres.existingSecret is set -- server-statefulset.yaml
and postgres-statefulset.yaml read that secret name directly instead.
*/}}
{{- if not .Values.postgres.existingSecret }}
{{- $secretName := include "immich.postgresSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $generated := printf "%s%s%s" (randAlpha 4) (randNumeric 4) (randAlpha 4 | upper) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
  annotations:
    # The postgres PVC survives `helm uninstall` (see README), so this
    # secret's password must too -- otherwise a reinstall generates a
    # new random password that no longer matches the volume's already-
    # initialized database, and postgres can never authenticate again.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{/*
  postgres.password pins an explicit value. Otherwise: reuse whatever is
  already stored in the cluster for this Secret name -- covers a real
  `helm upgrade`, and just as much a `helm uninstall` followed by
  `helm install` against the retained PVC (Helm sees that as a fresh
  install, but the volume's already-initialized password has to match
  regardless of what Helm calls the operation). Only generate fresh when
  `lookup` finds nothing, i.e. there really is no prior Secret.

  `lookup` always comes back empty under `helm template`/`--dry-run`/most
  GitOps renderers (no live cluster access), so those always take the
  "generate fresh" branch even when a Secret already exists out there --
  see the README's Database password section for that residual case.
  */}}
  {{- if .Values.postgres.password }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc }}
  {{- else if and $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- else }}
  POSTGRES_PASSWORD: {{ $generated | b64enc }}
  {{- end }}
{{- end }}
