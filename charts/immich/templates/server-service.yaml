apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.serverFullname" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "immich.selectorLabels" (dict "context" $ "component" "server") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "immich.serverFullname" . }}-headless
  labels:
    {{- include "immich.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "immich.selectorLabels" (dict "context" $ "component" "server") | nindent 4 }}
