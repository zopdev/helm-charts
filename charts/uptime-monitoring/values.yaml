# Monitoring platform uptime using metric probe_success
# Monitor days to SSL certificate expiry using (probe_ssl_earliest_cert_expiry - time()) / 86400

blackbox:
  image: prom/blackbox-exporter:v0.25.0
  servicePort: 9115

prometheus:
  image: prom/prometheus:v2.49.0
  scrapeInterval: 30s
  servicePort: 9090

targets: []

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
