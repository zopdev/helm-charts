{{- /*
SESSION_KEY and FORM_ENCRYPTION_KEY, generated per install. These used to be
fixed defaults in values.yaml, which every install that kept them shared with
anyone who can read this repo: enough to forge session cookies and read data
encrypted with the key. Both are generated on install and read back from the
live Secret on every upgrade, because a new SESSION_KEY signs everyone out and
a new FORM_ENCRYPTION_KEY makes existing encrypted data unreadable.
Pulled into the HeyForm pod via service.envFrom.secrets.
*/ -}}
{{- $secretName := printf "%s-app-secret" .Release.Name }}
{{- $sessionKey := randAlphaNum 64 }}
{{- $encryptionKey := randAlphaNum 64 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data }}
  {{- if hasKey $existing.data "SESSION_KEY" }}
    {{- $sessionKey = index $existing.data "SESSION_KEY" | b64dec }}
  {{- end }}
  {{- if hasKey $existing.data "FORM_ENCRYPTION_KEY" }}
    {{- $encryptionKey = index $existing.data "FORM_ENCRYPTION_KEY" | b64dec }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
type: Opaque
data:
  SESSION_KEY: {{ $sessionKey | b64enc }}
  FORM_ENCRYPTION_KEY: {{ $encryptionKey | b64enc }}
