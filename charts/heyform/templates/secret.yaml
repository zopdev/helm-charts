{{- if not .Values.secrets.existingSecret }}
{{/*
All four values are generated once and read back on every upgrade. A new
SESSION_KEY signs everyone out and a new FORM_ENCRYPTION_KEY voids issued
form tokens; a new database password would no longer match the one MongoDB
stored on its volume at first start. lookup is empty under `helm template`
and --dry-run, so those always show fresh values.
*/}}
{{- $name := include "heyform.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Kept with the volumes: the MongoDB volume only opens with this
    # password.
    helm.sh/resource-policy: keep
  labels:
    {{- include "heyform.labels" (list . "app") | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "SESSION_KEY" "FORM_ENCRYPTION_KEY" "MONGO_PASSWORD" "REDIS_PASSWORD" }}
  {{- if hasKey $data $key }}
  {{ $key }}: {{ index $data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
