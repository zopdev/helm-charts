apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "heyform.fullname" . }}-uploads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heyform.labels" (list . "app") | nindent 4 }}
  annotations:
    # Uploaded files outlive the release, like the two database volumes.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.storageClassName }}
  storageClassName: {{ .Values.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.diskSize | quote }}
