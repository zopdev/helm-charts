apiVersion: v1
kind: Service
metadata:
  name: {{ include "heyform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heyform.labels" (list . "app") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "heyform.selectorLabels" (list . "app") | nindent 4 }}
