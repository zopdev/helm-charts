apiVersion: v2
appVersion: "0.39.0"
description: Helm chart for deploying HolmesGPT, an AI agent for investigating production incidents
name: holmesgpt
version: 0.0.1
type: application
# TODO: replace with a zopdev-hosted copy, as every other chart uses.
# Pinned to a commit rather than a branch so an upstream path change
# cannot silently break the tile in the meantime.
icon: "https://raw.githubusercontent.com/HolmesGPT/holmesgpt/a4b6eaf09b77c576533151d86287bd266d872d09/docs/assets/logo.png"
maintainers:
  - name: ZopDev
    url: zop.dev
# HolmesGPT publishes a maintained chart that already owns the parts worth
# not reimplementing: the CRDs, the ClusterRole it needs to read a cluster,
# the operator, and the per-integration MCP servers. This chart wraps it and
# adds what the zop.dev platform expects and upstream does not ship -- a
# values.schema.json for the settings UI, an ingress, and alerts.
dependencies:
  - name: holmes
    version: 0.39.0
    repository: https://robusta-charts.storage.googleapis.com
annotations:
  type: application
