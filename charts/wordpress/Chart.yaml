apiVersion: v2
appVersion: "1.0"
description: Helm chart for deploying WordPress app
name: wordpress
version: 0.0.8
type: application
icon: "https://storage.googleapis.com/zopdev-test-bucket/zop/files/originals/20241129/9f2ff083-4ba6-4494-91d4-c6c7c96c8ab0-download.jpeg"
dependencies:
  - name: mysql
    repository: "https://helm.zop.dev"
    version: 0.0.17
  # PINNED to 0.0.17 ON PURPOSE - do not bump without re-checking the env wiring.
  # From 0.0.18 the service chart stopped rendering .Values.env as container `env:`
  # entries and moved them into a <name>-env-configmap consumed via envFrom. The
  # kubelet only expands $(VAR) inside `env:` values, never inside a ConfigMap, so
  # under 0.0.32 WordPress receives the literal string "$(DB_HOST):$(DB_PORT)" as
  # its database host and cannot connect.
  - name: service
    repository: "https://helm.zop.dev"
    version: 0.0.17
maintainers:
  - name: ZopDev
    url: zop.dev
annotations:
  type: application