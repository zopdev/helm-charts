apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "mongodb.fullname" . }}
    release: {{ .Release.Name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: tcp-mongodb
      port: 27017
      targetPort: tcp-mongodb
  selector:
    app: {{ include "mongodb.fullname" . }}
