{{- $secretName := include "mongodb.rootSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $rootPassword := printf "%s%s%s" (randAlpha 6) (randNumeric 6) (randAlpha 6 | upper) }}
{{- if and $existing $existing.data (hasKey $existing.data "mongodb-root-password") }}
{{- $rootPassword = index $existing.data "mongodb-root-password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survives helm uninstall, like the data PVC does. The password is written
    # into the volume on first boot only, so a reinstall onto the retained PVC
    # must find and reuse this Secret; a freshly generated one would lock every
    # client out. A reinstall with the same release name adopts it again.
    helm.sh/resource-policy: keep
  labels:
    app: {{ include "mongodb.fullname" . }}
    chart: {{ include "mongodb.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  # The root password is written into the data volume on first boot only, so it
  # is read back from the live Secret on every upgrade instead of regenerated -
  # a new value here would no longer match what mongod has stored.
  mongodb-root-username: {{ "root" | b64enc }}
  mongodb-root-password: {{ $rootPassword | b64enc }}
