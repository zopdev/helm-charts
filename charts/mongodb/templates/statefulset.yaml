apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "mongodb.fullname" . }}
    chart: {{ include "mongodb.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ include "mongodb.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "mongodb.fullname" . }}
        release: {{ .Release.Name | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # The mongo image's entrypoint drops to the mongodb user (uid/gid 999);
        # fsGroup makes the fresh volume writable by it.
        fsGroup: 999
      containers:
        - name: mongodb
          image: "mongo:{{ .Values.version }}"
          args:
            # mongod sizes its cache from the node's RAM, not the container
            # limit, so without this it would grow past resources.limits.memory
            # and be OOM-killed under load.
            - "--wiredTigerCacheSizeGB"
            - {{ .Values.wiredTigerCacheSizeGB | quote }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.rootSecretName" . }}
                  key: mongodb-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.rootSecretName" . }}
                  key: mongodb-root-password
          ports:
            - name: tcp-mongodb
              containerPort: 27017
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Liveness only needs "is mongod accepting connections", so it is a
          # TCP check: running mongosh (a Node process) inside this container
          # every few seconds would count against its memory limit. Readiness
          # keeps the real ping, less often and with a generous timeout so CPU
          # throttling does not flap it. ping needs no authentication.
          livenessProbe:
            tcpSocket:
              port: tcp-mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --norc
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 4
          volumeMounts:
            - name: {{ .Release.Name }}-mongodb-persistent-storage
              mountPath: /data/db

        - name: mongodb-exporter
          image: "percona/mongodb_exporter:0.40.0"
          args:
            - "--web.listen-address=:2121"
            - "--collector.diagnosticdata"
            - "--compatible-mode"
          env:
            - name: MONGODB_URI
              value: "mongodb://localhost:27017/admin"
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.rootSecretName" . }}
                  key: mongodb-root-username
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.rootSecretName" . }}
                  key: mongodb-root-password
          ports:
            - containerPort: 2121
              name: metrics
          resources:
            requests:
              memory: "50Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
  volumeClaimTemplates:
    - metadata:
        name: {{ .Release.Name }}-mongodb-persistent-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.diskSize | quote }}
