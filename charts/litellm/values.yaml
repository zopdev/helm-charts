# PostgreSQL backing store (zopdev/postgres subchart). LiteLLM persists keys,
# spend and (with storeModelInDB) UI/API-added models here. The subchart emits a
# per-database secret carrying DATABASE_URL, which the proxy consumes via envFrom.
postgres:
  enabled: true
  services:
    - name: litellm
      database: litellm

image:
  repository: ghcr.io/berriai/litellm-database
  # litellm-database bundles Prisma and runs the DB migrations on container start.
  # Pinned to an immutable stable tag for reproducibility (main-stable is a moving
  # tag). Falls back to .Chart.AppVersion when set to "".
  tag: main-v1.83.14-stable
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

# Persist models added through the Admin UI / API into Postgres so they survive
# pod restarts (otherwise they are in-memory only).
storeModelInDB: true

logLevel: INFO

masterkey:
  # Set the master key explicitly. Takes precedence over auto-generation, so the
  # key is reproducible and can be handed to callers up front. Leave empty to let
  # the chart generate one. Ignored when existingSecret is set.
  value: ""
  # If set, this pre-created secret is used as-is for the proxy master key.
  # Otherwise a secret is auto-generated and preserved across upgrades.
  existingSecret: ""
  secretKey: PROXY_MASTER_KEY

metrics:
  # Renders a ServiceMonitor scraping LiteLLM's own /metrics on the proxy port.
  enabled: true
  scrapeInterval: 30s

# Provider API keys managed by this chart. Each entry becomes a key in the
# chart-owned <fullname>-apikeys Secret, mounted via envFrom, so a model declared
# with api_key: os.environ/OPENAI_API_KEY resolves without pre-creating a secret
# by hand. Values are stored in the release, so prefer extraEnvFrom when a secret
# already exists or is managed by an external secrets operator.
apiKeys: {}
#  OPENAI_API_KEY: sk-...

# Existing secrets that hold provider API keys (e.g. OPENAI_API_KEY). Each is
# mounted via envFrom so keys referenced as os.environ/<VAR> in proxy_config resolve.
extraEnvFrom: []
#  - secretName: litellm-provider-keys

# Extra plain environment variables (avoid putting secrets here).
extraEnv: {}

# Rendered verbatim to /etc/litellm/config.yaml. At least one model is required
# for the proxy to boot. To add a real provider, append to model_list, set
# api_key: os.environ/<VAR>, and expose <VAR> via extraEnvFrom.
proxy_config:
  model_list:
    - model_name: placeholder
      litellm_params:
        model: openai/gpt-3.5-turbo
        api_key: os.environ/OPENAI_API_KEY
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY

# Sized so a default install boots without being OOM-killed. On start the
# litellm-database image runs Prisma (a Node process) to apply migrations while the
# Python proxy imports ~100 provider SDKs, so peak boot RSS sits well above the
# steady state. LiteLLM's own guidance is a 1Gi floor with a 1.5Gi limit; upstream
# production guidance is 4Gi per uvicorn worker. 1Gi requested / 2Gi limit clears
# the boot spike and leaves headroom for LiteLLM's known slow RAM growth, while
# still fitting a small single-node cluster.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# Fixed number of proxy pods. LiteLLM keeps no local state (keys/models live in the Secret,
# ConfigMap and PostgreSQL), so this is safe to raise.
# IGNORED when autoscaling.enabled is true: the Deployment then omits `replicas` entirely so
# the HPA owns it, otherwise helm and the HPA would fight over the field on every upgrade.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
