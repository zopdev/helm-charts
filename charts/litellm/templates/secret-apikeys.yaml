{{- if .Values.apiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.apiKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
type: Opaque
# `data` (base64), not `stringData`: with stringData, REMOVING a key from apiKeys
# leaves it in the live Secret forever. helm's 3-way merge emits
# {"stringData":{"OLD_KEY":null}}, and the API server does not translate a null
# stringData entry into a deletion from `data`, so the stale provider key stays in
# the pod's env. Verified on minikube: after dropping ANTHROPIC_API_KEY the Secret
# still held c2stYW50LXh5eg==. With `data` the same patch deletes the key.
data:
  {{- range $key, $value := .Values.apiKeys }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
