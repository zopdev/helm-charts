{{- if not .Values.masterkey.existingSecret }}
{{- $secretName := printf "%s-masterkey" (include "litellm.fullname" .) }}
{{- $generatedKey := printf "sk-%s" (randAlphaNum 32) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $masterKey := $generatedKey }}
{{- if $existingSecret }}
  {{- with $existingSecret.data }}
    {{- if hasKey . $.Values.masterkey.secretKey }}
      {{- $masterKey = index . $.Values.masterkey.secretKey | b64dec }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.masterkey.secretKey }}: {{ $masterKey | b64enc }}
{{- end }}
