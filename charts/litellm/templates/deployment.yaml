apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  {{/* Derived from the startup budget, never below it: the Kubernetes default
       is 600s, which the budget alone can reach, and a Deployment that trips
       ProgressDeadlineExceeded reads as Degraded to ArgoCD/Flux even though
       helm's own readiness check ignores that condition. */}}
  progressDeadlineSeconds: {{ add (mul .Values.probes.startup.periodSeconds .Values.probes.startup.failureThreshold) 300 }}
{{- if not .Values.autoscaling.enabled }}
  replicas: 1
{{- end }}
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/litellm/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            {{- if .Values.postgres.enabled }}
            # DATABASE_URL (+ DB_USER/DB_PASSWORD) from the postgres subchart secret.
            - secretRef:
                name: {{ include "litellm.postgresSecretName" . }}
            {{- end }}
            {{- range .Values.extraEnvFrom }}
            # When postgres.enabled=false, supply DATABASE_URL via one of these secrets.
            - secretRef:
                name: {{ .secretName }}
            {{- end }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: STORE_MODEL_IN_DB
              value: {{ .Values.storeModelInDB | quote }}
            - name: LITELLM_LOG
              value: {{ .Values.logLevel | quote }}
            - name: PROXY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm.masterkeySecretName" . }}
                  key: {{ .Values.masterkey.secretKey }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{/* Holds the other two off until the proxy first answers, so a slow
               boot is not read as a crash. periodSeconds x failureThreshold is
               the entire budget: exceed it and the kubelet kills the container,
               which restarts the boot from zero rather than waiting longer. */}}
          startupProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: litellm-config
          configMap:
            name: {{ include "litellm.fullname" . }}-config
