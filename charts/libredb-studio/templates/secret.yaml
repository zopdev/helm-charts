{{- if not .Values.auth.existingSecret }}
{{/*
JWT_SECRET signs sessions and also seals the passwords of saved connections
in the SQLite store, so both values are generated once and read back on every
upgrade. lookup is empty under `helm template` and --dry-run, so those always
show fresh values.
*/}}
{{- $name := include "libredb-studio.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- end }}
{{- $jwt := randAlphaNum 64 }}
{{- if hasKey $data "JWT_SECRET" }}
{{- $jwt = index $data "JWT_SECRET" | b64dec }}
{{- end }}
{{- $password := randAlphaNum 24 }}
{{- if hasKey $data "ADMIN_PASSWORD" }}
{{- $password = index $data "ADMIN_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Kept with the volume: without this key the saved passwords on it are
    # unreadable.
    helm.sh/resource-policy: keep
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $jwt | b64enc }}
  ADMIN_PASSWORD: {{ $password | b64enc }}
{{- end }}
