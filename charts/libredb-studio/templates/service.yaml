apiVersion: v1
kind: Service
metadata:
  name: {{ include "libredb-studio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "libredb-studio.selectorLabels" . | nindent 4 }}
