apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "libredb-studio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "libredb-studio.labels" . | nindent 4 }}
  annotations:
    # The data outlives the release.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.diskSize | quote }}
