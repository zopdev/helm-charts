{{- /*
First admin account, handed to listmonk as LISTMONK_ADMIN_USER and
LISTMONK_ADMIN_PASSWORD through service.envFrom.secrets. listmonk reads them
only while installing into an empty database.

A password set in values wins. Left empty, one is generated on install and
read back from the live Secret on every upgrade, so it stays the one listmonk
was installed with. lookup is empty under `helm template` and --dry-run, so
those always show a fresh value.
*/ -}}
{{- $secretName := printf "%s-admin" .Release.Name }}
{{- $password := .Values.admin.password | default "" }}
{{- if and $password (lt (len $password) 8) }}
{{- fail "admin.password must be at least 8 characters (or empty to generate one)" }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 24 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "LISTMONK_ADMIN_PASSWORD") }}
{{- $password = index $existing.data "LISTMONK_ADMIN_PASSWORD" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Survives helm uninstall, like the Postgres data holding the account it
    # describes; a reinstall under the same release name adopts it again.
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
type: Opaque
data:
  LISTMONK_ADMIN_USER: {{ required "admin.username is required" .Values.admin.username | b64enc }}
  LISTMONK_ADMIN_PASSWORD: {{ $password | b64enc }}
