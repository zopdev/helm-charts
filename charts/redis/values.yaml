diskSize: "10Gi"

version: "6.2.13"

# Export stream and consumer-group metrics (redis_stream_*) from the redis
# exporter. Event-bus streams live in DB 15 (GoFr REDIS_PUBSUB_DB default), so
# the exporter scans db15. Set false to switch it off.
checkStreams: true

# Resource configuration
resources:
  requests:
    cpu: "500m"
    memory: "256M"
  limits:
    cpu: "1500m"
    memory: "1Gi"

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
