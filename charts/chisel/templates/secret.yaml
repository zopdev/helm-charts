{{/*
Clients hold the server's fingerprint and their password, so both generated
Secrets are read back on every upgrade and kept on uninstall. lookup is empty
under `helm template` and --dry-run, so those always show fresh values.
*/}}
{{- if not .Values.key.existingSecret }}
{{- $name := include "chisel.keySecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := genPrivateKey "ecdsa" | b64enc }}
{{- if and $existing $existing.data (hasKey $existing.data "server.key") }}
{{- $key = index $existing.data "server.key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "chisel.labels" . | nindent 4 }}
type: Opaque
data:
  server.key: {{ $key }}
{{- end }}
{{- if and (not .Values.feed.enabled) (not .Values.auth.existingSecret) }}
{{- $name := include "chisel.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $users := printf `{"chisel:%s": ["^R:0\\.0\\.0\\.0:[0-9]+$"]}` (randAlphaNum 32) | b64enc }}
{{- if and $existing $existing.data (hasKey $existing.data "users.json") }}
{{- $users = index $existing.data "users.json" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "chisel.labels" . | nindent 4 }}
type: Opaque
data:
  # One user that may open reverse listeners on 0.0.0.0 only: no forward
  # remotes, so the password cannot reach what the pod can reach.
  users.json: {{ $users }}
{{- end }}
