apiVersion: v1
kind: Service
metadata:
  name: {{ include "chisel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chisel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    {{- if include "chisel.reversePortsEnabled" . }}
    {{- range $port := untilStep (int .Values.reversePorts.start) (int (add1 .Values.reversePorts.end)) 1 }}
    - name: reverse-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
    {{- end }}
    {{- end }}
  selector:
    {{- include "chisel.selectorLabels" . | nindent 4 }}
