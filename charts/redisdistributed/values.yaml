version: "6.2.13"

master:
  resources:
    requests:
      cpu: "100m"
      memory: "500Mi"
    limits:
      cpu: "500m"
      memory: "1000Mi"

  persistence:
    size: 10Gi
  
slave:
  enable : true
  count: 1
  resources:
    requests:
      cpu: "100m"
      memory: "500Mi"
    limits:
      cpu: "500m"
      memory: "1000Mi"

  persistence:
    size: 10Gi

# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
