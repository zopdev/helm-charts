{{- if .Values.supersetCeleryFlower.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "superset.fullname" . }}-flower
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "superset.name" . }}-flower
    chart: {{ template "superset.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
    {{- include "supersetCeleryFlower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "superset-config" . | sha256sum }}
      labels:
        app: "{{ template "superset.name" . }}-flower"
        release: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 0
      initContainers:
        - name: wait-for-postgres-redis
          image: apache/superset:dockerize
          imagePullPolicy: IfNotPresent
          env:
            {{- include "superset.dbEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: '{{ template "superset.fullname" . }}-env'
          command:
            - /bin/sh
            - -c
            - dockerize -wait "tcp://$DB_HOST:$DB_PORT" -wait "tcp://$REDIS_HOST:$REDIS_PORT" -timeout 120s
      containers:
        - name: "{{ .Chart.Name }}-flower"
          image: {{ include "superset.image" . | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            # Three things were wrong here. The command used to be a FOUR element array
            # ("sh", "-c", "pip install psycopg2-binary==2.9.6", "celery ... flower"), and
            # `sh -c` runs only its first operand, so the container pip-installed and exited.
            # It also never sourced superset_bootstrap.sh, and the Superset image does not
            # ship Flower - `celery flower` fails with "Error: No such command 'flower'"
            # (verified on minikube), so the package has to be installed first.
            - ". /app/pythonpath/superset_bootstrap.sh; pip install --no-cache-dir flower==2.0.1; celery --app=superset.tasks.celery_app:app flower --port=5555"
          env:
            {{- include "superset.dbEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ template "superset.fullname" . }}-env
          ports:
            - name: flower
              containerPort: 5555
              protocol: TCP
          volumeMounts:
            - name: superset-config
              mountPath: "/app/pythonpath"
              readOnly: true
          # /api/workers needs auth in this flower version and answers 401 forever:
          #   401 GET /api/workers: FLOWER_UNAUTHENTICATED_API environment variable is
          #   required to enable API without authentication
          # so all three probes failed and the pod NEVER became Ready even though flower
          # was running and connected to redis. /healthcheck is flower's unauthenticated
          # health endpoint (verified in-pod: /healthcheck 200, /api/workers 401).
          startupProbe:
            httpGet:
              path: /healthcheck
              port: flower
            initialDelaySeconds: 5
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: flower
            initialDelaySeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: flower
            initialDelaySeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 5
            successThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: superset-config
          secret:
            secretName: {{ template "superset.fullname" . }}-config
{{- end -}}
