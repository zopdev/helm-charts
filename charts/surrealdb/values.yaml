# values.yaml for SurrealDB Helm chart

# image version for surrealdb
version: v2

# Resource configuration
resources:
  requests:
    cpu: "100m"
    memory: "256M"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# disk size for surrealdb
diskSize: "10Gi"




# Pod scheduling. All three are optional and render nothing when left empty,
# so existing releases are unaffected. Use them to pin the workload to a
# dedicated (optionally tainted) node pool.
nodeSelector: {}
#  workload: stateful

tolerations: []
#  - key: workload
#    operator: Equal
#    value: stateful
#    effect: NoSchedule

affinity: {}
