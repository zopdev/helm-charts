{{- if .Values.distributed.enabled }}
{{- $secretName := include "localai.registrationSecretName" . }}

{{/*
Reuse the token already stored in the cluster when the operator has not
pinned one. Regenerating it on every upgrade would roll the frontend and
its workers onto different tokens, and every worker would fail to
re-register.
*/}}
{{- $token := .Values.distributed.registrationToken }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "registration-token") }}
{{- $token = index $existing.data "registration-token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "localai.labels" . | nindent 4 }}
type: Opaque
data:
  registration-token: {{ $token | b64enc | quote }}

{{- if .Values.metrics.enabled }}
{{/*
Credential Prometheus scrapes with. Needed only in distributed mode,
where authentication is forced on and covers /metrics too.

Note what this is: LocalAI has no metrics-only credential, so the key
that reads /metrics is a full API key. It is generated rather than
shared with anything else, and preserved across upgrades like the
registration token, but anyone able to read this Secret can call the
inference API. Set metrics.enabled=false to not create it.
*/}}
{{- $metricsSecretName := printf "%s-metrics" (include "localai.fullname" .) }}
{{- $apiKey := "" }}
{{- $existingMetrics := lookup "v1" "Secret" .Release.Namespace $metricsSecretName }}
{{- if and $existingMetrics $existingMetrics.data (hasKey $existingMetrics.data "api-key") }}
{{- $apiKey = index $existingMetrics.data "api-key" | b64dec }}
{{- else }}
{{- $apiKey = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $metricsSecretName }}
  labels:
    {{- include "localai.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $apiKey | b64enc | quote }}
{{- end }}
{{- end }}
